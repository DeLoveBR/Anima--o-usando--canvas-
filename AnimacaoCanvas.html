<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação usando Canvas - Aula Prática</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid #4ecca3;
            border-radius: 8px;
            background-color: #12121c;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
        p {
            margin-top: 12px;
            color: #cccccc;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <h2>Animação Interativa com HTML5 &lt;canvas&gt;</h2>
    <canvas id="meuCanvas" width="700" height="400"></canvas>
    <p>Clique em qualquer lugar do quadro para alterar instantaneamente as cores e a direção dos objetos.</p>

    <!-- Aponta para o arquivo script.js na mesma pasta -->
    <script src="script.js"></script>
</body>
</html>
